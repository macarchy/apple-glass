[controls]
# Control chrome on glass. Apple's dark-mode controls are a white fill at low
# alpha over the blurred material rather than a filled box, so the surface
# behind still shows through and the control reads as part of the same pane.

normal-color        = "#f5f5f7"
normal-fill-alpha   = 0.09
normal-border       = "#ffffff"
normal-border-width = 1
normal-border-alpha = 0.16

hover-cursor-color        = "#f5f5f7"
hover-cursor-fill-alpha   = 0.15
hover-cursor-border       = "#ffffff"
hover-cursor-border-width = 1
hover-cursor-border-alpha = 0.26

# Omarchy's default deliberately makes keyboard focus look identical to hover.
# macOS does the opposite: the blue focus ring is one of the few places the
# system insists on being loud, because it is the only cue for where the
# keyboard is pointing.
focus-color        = "#f5f5f7"
focus-fill-alpha   = 0.15
focus-border       = "#0a84ff"
focus-border-width = 1
focus-border-alpha = 0.9

selected-color        = "#0a84ff"
selected-fill-alpha   = 0.8
selected-border       = "#0a84ff"
selected-border-width = 0
selected-border-alpha = 1.0

pressed-fill-alpha   = 0.28
selection-fill-alpha = 0.4
